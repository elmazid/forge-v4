<!DOCTYPE html>
<!-- FORGE V4.0: Tactical Triad System Blueprint[cite: 1] -->
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE V4.0">
<title>FORGE V4.0 — Tactical Triad System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141A;--s1:#1A1D24;--s2:#22262F;--s3:#2C313C;--b1:#343A46;--b2:#434A59;--b3:#565E70;--gold:#D4AF37;--gold2:#F1E3A0;--gold-bg:rgba(212,175,55,.08);--tx:#F3F4F6;--t2:#9CA3AF;--t3:#6B7280;--green:#10B981;--green-bg:rgba(16,185,129,.1);--red:#EF4444;--red-bg:rgba(239,68,68,.1);--ora:#F59E0B;--fri:#38BDF8;--sat:#8B5CF6;--sun:#10B981;--mon:#9CA3AF;--tue:#F59E0B;--wed:#EF4444;--thu:#9CA3AF;--r:12px;--r2:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Sora',sans-serif;font-size:13px;line-height:1.45;overscroll-behavior-y:none;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.raj{font-family:'Rajdhani',sans-serif;letter-spacing:.4px}
button,input,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
.hdr{position:sticky;top:0;z-index:40;height:54px;background:rgba(18,20,26,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;max-width:480px;margin:0 auto}
.brand-t{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;color:var(--gold);line-height:1}
.brand-s{font-size:10px;color:var(--t2);letter-spacing:.5px;text-transform:uppercase}
#phase-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--gold-bg);color:var(--gold2);border:1px solid rgba(212,175,55,.3)}
.wk-ctrl{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:2px 6px}
.wk-btn{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--gold);padding:0 5px}
#wnum{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;min-width:42px;text-align:center}
#rest-banner{position:fixed;top:54px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:var(--s1);border-bottom:1px solid var(--gold);padding:8px 14px;display:none;align-items:center;justify-content:space-between;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#rest-banner.show{display:flex}
#rest-mode{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--gold-bg);color:var(--gold)}
#rest-cd{font-family:'Rajdhani',sans-serif;font-size:30px;font-weight:700;color:var(--tx);line-height:1}
.rest- track{flex:1;margin:0 12px;height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
#rest-bar{height:100%;background:var(--gold);width:100%;transition:width .25s linear}
.skip-btn{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:var(--gold2);background:var(--s3);border:1px solid var(--b2);padding:5px 10px;border-radius:6px}
#content{max-width:480px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card-title{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;color:var(--tx)}
.sub-tag{font-size:11px;color:var(--t2);margin-bottom:8px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.bdg{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--s2);border:1px solid var(--b1);color:var(--t2)}
.bdg.gold{background:var(--gold-bg);border-color:rgba(212,175,55,.35);color:var(--gold2)}
.bdg.grn{background:var(--green-bg);border-color:rgba(16,185,129,.35);color:var(--green)}
.bdg.red{background:var(--red-bg);border-color:rgba(239,68,68,.35);color:var(--red)}
.sleep-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.slp-btn{padding:7px 4px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--b1);font-size:11px;font-weight:600;text-align:center;color:var(--t2)}
.slp-btn.on-green{background:var(--green-bg);border-color:var(--green);color:var(--tx)}
.slp-btn.on-yellow{background:rgba(245,158,11,.12);border-color:var(--ora);color:var(--tx)}
.slp-btn.on-red{background:var(--red-bg);border-color:var(--red);color:var(--tx)}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.d-btn{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:6px 2px;text-align:center;position:relative}
.d-btn.active{background:var(--s3);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.d-btn .d-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;display:block}
.d-btn .d-dot{width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:var(--b2)}
.d-btn.done .d-dot{background:var(--green)}
.sets-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.set-c{width:34px;height:34px;border-radius:50%;background:var(--s2);border:1.5px solid var(--b2);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--t2);display:flex;align-items:center;justify-content:center}
.set-c.done{background:var(--green);border-color:var(--green);color:#000}
.act-btn{padding:6px 10px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--b2);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;color:var(--gold2)}
.act-btn.tm{border-color:rgba(16,185,129,.4);color:var(--green)}
.met-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--b1)}
.met-box{background:var(--s2);border:1px solid var(--b1);border-radius:6px;padding:5px 8px;display:flex;align-items:center;justify-content:space-between}
.met-box label{font-size:10px;color:var(--t2)}
.met-box input{width:54px;text-align:right;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--gold2)}
.acc-btn{width:100%;text-align:left;padding:7px 9px;background:var(--s2);border:1px solid var(--b1);border-radius:6px;font-size:11px;color:var(--t2);display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.acc-body{display:none;padding:8px;background:rgba(0,0,0,.22);border:1px solid var(--b1);border-top:none;border-radius:0 0 6px 6px;font-size:11.5px;color:var(--tx);white-space:pre-line}
.acc-body.open{display:block}
.alert{padding:10px 12px;border-radius:var(--r2);margin-bottom:10px;font-size:11.5px;border:1px solid}
.alert.red{background:var(--red-bg);border-color:var(--red);color:#FCA5A5}
.alert.gold{background:var(--gold-bg);border-color:var(--gold);color:var(--gold2)}
.alert.grn{background:var(--green-bg);border-color:var(--green);color:#A7F3D0}
.btn-main{width:100%;padding:12px;border-radius:var(--r);background:var(--gold);color:#000;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;text-align:center;letter-spacing:.5px;margin-top:8px}
.btn-main.done{background:var(--green);color:#000}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(26,29,36,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--b1);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:40}
.tab{text-align:center;color:var(--t3);font-size:10px;font-weight:600;padding:4px 0}
.tab.active{color:var(--gold)}
.tab span{display:block;font-size:16px;margin-bottom:2px}
.tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
.tbl th,.tbl td{border:1px solid var(--b1);padding:6px;text-align:left}
.tbl th{background:var(--s2);color:var(--gold2);font-family:'Rajdhani',sans-serif;font-size:12px}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--s3);color:var(--gold2);border:1px solid var(--gold);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;z-index:60;display:none;box-shadow:0 6px 16px rgba(0,0,0,.5)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--s1);border-top:1px solid var(--b2);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<header class="hdr">
  <div>
    <div class="brand-t">FORGE V4.0</div>
    <div class="brand-s">Tactical Triad System</div>
  </div>
  <div id="phase-badge">FASE 1: ADAPTASI</div>
  <div class="wk-ctrl">
    <button class="wk-btn" onclick="chgWeek(-1)">‹</button>
    <div id="wnum">M1/11</div>
    <button class="wk-btn" onclick="chgWeek(1)">›</button>
  </div>
</header>

<div id="rest-banner">
  <span id="rest-mode">Rest</span>
  <span id="rest-cd">00:00</span>
  <div class="rest-track" style="flex:1;margin:0 12px;height:6px;background:var(--s3);border-radius:3px;overflow:hidden"><div id="rest-bar"></div></div>
  <button class="skip-btn" onclick="skipCD()">SKIP ›</button>
</div>

<main id="content"></main>

<nav class="tabbar">
  <button class="tab active" id="tab-workout" onclick="setTab('workout')"><span>🏹</span>Latihan</button>
  <button class="tab" id="tab-gate" onclick="setTab('gate')"><span>🎯</span>Progress</button>
  <button class="tab" id="tab-history" onclick="setTab('history')"><span>📊</span>Log</button>
  <button class="tab" id="tab-insight" onclick="setTab('insight')"><span>📖</span>Insight</button>
</nav>

<div id="toast"></div>
<div id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <h3 id="m-title" class="card-title" style="margin-bottom:6px"></h3>
    <p id="m-body" style="color:var(--t2);font-size:12px;margin-bottom:14px"></p>
    <div style="display:flex;gap:8px">
      <button class="act-btn" style="flex:1;padding:10px" onclick="closeModal()">Batal</button>
      <button id="m-ok" class="btn-main" style="flex:1;margin:0;padding:10px">OK</button>
    </div>
  </div>
</div>

<script>
const PFX='forge_v40_';
const DAYS=['fri','sat','sun','mon','tue','wed','thu'];
const DINFO={

  thu:{l:'Kamis',s:'Rest + Micro-Routine #2',c:'var(--thu)',mvwOpt:true}

const WC={
  wm:[
    {n:'1. Fase Raise: Jalan Cepat / Jogging Santai',u:'2-3 mnt',timerSec:150,info:'Naikkan suhu tubuh & denyut jantung di treadmill.'},

    {n:'2. Child\'s Pose + Lat Reach',u:'60 dtk',timerSec:60,info:'Duduk di atas tumit, rentangkan tangan jauh ke depan & geser serong kiri-kanan.'},
    {n:'3. Pernapasan Diafragma 4-8',u:'30-60 dtk',timerSec:45,info:'Tarik napas tenang 4d lewat hidung, embuskan perlahan 8d lewat mulut (menurunkan HR).'}
  ]
};

const MICRO=[
  {n:'1. McGill Curl-Up',sub:'Kontrol Motorik Lumbal',s:2,r:'5 rep (Tahan 7d)',u:'Bodyweight',rest:30,tm:true,timerSec:7,targetP10:'Lumbal Stabil',plafon:'Bebas Nyeri Pinggang',info:'Satu kaki lurus, satu lutut ditekuk. Selipkan tangan di bawah lengkung lumbal. Angkat kepala & bahu sedikit saja sambil mengunci perut (jangan tekuk leher).',metric:[]},
  {n:'2. McGill Side Plank',sub:'Stabilitas Lateral (QL & Obliques)',s:2,r:'20-30 dtk/sisi',u:'Bodyweight',rest:30,tm:true,timerSec:25,targetP10:'30 dtk/sisi stabil',plafon:'Korset Lateral Kuat',info:'Tumpuan pada siku dan lutut/kaki. Kunci otot pinggang samping.',metric:[]},
  {n:'3. McGill Bird-Dog',sub:'Stabilitas Tulang Belakang',s:2,r:'6-8 rep/sisi (Tahan 5d)',u:'Bodyweight',rest:30,tm:true,timerSec:5,targetP10:'8 rep/sisi tanpa goyang',plafon:'Kontrol Saraf Inti',info:'Merangkak, rentangkan tangan kanan ke depan & kaki kiri lurus ke belakang. Kunci perut rapat agar pinggang tak melengkung.',metric:[]},
  {n:'4. Chin Tucks',sub:'Koreksi Postur Leher',s:1,r:'10 rep (Tahan 2d)',u:'Bodyweight',rest:0,tm:true,timerSec:20,targetP10:'Postur Leher Tegak',plafon:'Anti Forward-Head',info:'Tarik leher dan kepala lurus ke belakang (buat dagu ganda). Melawan postur leher maju akibat layar.',metric:[]},
  {n:'5. Prone Thoracic Ext.',sub:'Ekstensi Punggung Atas',s:1,r:'8 rep',u:'Bodyweight',rest:0,targetP10:'Thoracic Mobile',plafon:'Anti Bungkuk',info:'Tengkurap, kunci bokong rapat-rapat, angkat dada atas sedikit dari lantai (mencegah kompresi pinggang bawah).',metric:[]},
  {n:'6. Band Archer Pull',sub:'Retraksi Skapula Panahan',s:1,r:'5 rep/sisi',u:'Band Teringan',rest:0,targetP10:'Belikat Stabil',plafon:'Postur Panahan',info:'Gunakan karet resistensi teringan, tarik seperti memanah, fokus penuh ke retraksi tulang belikat.',metric:[]}
];

const EX={
  tue:[
    {n:'1. Negative Pull-Up (Feeder #1)',sub:'Upper Pull & Kontrol Eksentrik',s:3,r:'3-5',u:'Bodyweight (Bangku)',rest:90,tm:true,timerSec:5,targetP10:'1 Strict Pull-Up (stretch: 2-3)',plafon:'5-8 Strict Pull-Up',info:'Napas: Mengalir, embuskan pelan lewat bibir sepanjang turun.\nEksekusi: Naik dari bangku pijakan, kunci belikat turun, turun SANGAT lambat 4-5 detik.\nProgresi: Perlambat turun hingga 6-8 detik sebelum coba pull-up utuh.',metric:[{k:'npu_sec',l:'Turun (dtk)'},{k:'npu_reps',l:'Rep'}]},
    {n:'2. Lat Pulldown',sub:'Latissimus Dorsi (Feeder Pull-Up)',s:2,r:'8-10',u:'Awal: 25 kg',rest:90,isComp:true,targetP10:'32-35 kg',plafon:'45-50 kg (2x10 rep)',info:'Napas: Tarik saat beban naik meregang, buang saat ditarik ke dada atas.\nEksekusi: Arahkan siku ke saku belakang.\nProgresi: Naik 1 pin jika tembus 2x10 di 2 sesi berurut, ATAU perlambat eksentrik 4d.',metric:[{k:'lpd_kg',l:'Beban (kg)'},{k:'lpd_reps',l:'Rep'}]},
    {n:'3. Military Push-Up',sub:'Pendorong Horizontal & Triceps',s:2,r:'Max-2',u:'Bodyweight (RIR 2-3)',rest:90,targetP10:'+5 s.d. +8 rep dari awal',plafon:'20-25 rep bersih/set',info:'Napas: Tarik saat dada turun, buang saat mendorong naik.\nEksekusi: Siku rapat menyusur badan (<45°), perut & bokong kencang. Sisakan 2-3 rep cadangan.\nProgresi: Tambah repetisi bersih perlahan tiap minggu.',metric:[{k:'mpu_reps',l:'Rep Bersih'}]},
    {n:'4. Incline DB Press (30°)',sub:'Dada Atas & Bahu Depan (Siluet Tegap)',s:3,r:'8-12',u:'Awal: 2 x 5 kg',rest:90,isComp:true,targetP10:'2 x 7,5 kg',plafon:'2 x 15 kg (3x10 rep)',info:'Napas: Tarik saat beban turun ke dada, buang saat didorong.\nSetup: Bangku 30° (1-2 cekungan di atas flat), siku serong 45°.\nProgresi: Capai 3x12 di 5 kg, lalu gunakan Set Jembatan (Set 1-2: 7,5 kg x 5-6 rep, Set 3: 5 kg) menuju 2x7,5 kg.',metric:[{k:'idb_kg',l:'DB/tgn (kg)'},{k:'idb_reps',l:'Rep'}]},
    {n:'5. Seated Cable Row',sub:'Rhomboids & Punggung Tengah',s:3,r:'10-12',u:'Awal: 18 kg',rest:90,targetP10:'25-27 kg',plafon:'35-40 kg (3x10-12)',info:'Napas: Tarik saat beban maju meregang, buang saat ditarik ke perut.\nEksekusi: Tarik pundak/belikat rapat ke belakang, tahan 1 detik.\nProgresi: Naik 1 pin setelah tembus 3x12 ATAU perlambat eksentrik 4d.',metric:[{k:'scr_kg',l:'Beban (kg)'},{k:'scr_reps',l:'Rep'}]},
    {n:'6. DB Overhead Press',sub:'Pilar Bahu Vertikal',s:3,r:'8-12',u:'Awal: 2 x 5 kg',rest:90,targetP10:'2 x 7,5 kg',plafon:'2 x 12,5 kg (3x10 rep)',info:'Napas: Tarik saat DB turun sejajar telinga, buang saat dorong vertikal.\nEksekusi: Kunci perut & bokong agar pinggang tak melengkung.\nProgresi: Capai 3x12 di 5 kg, lalu Set Jembatan menuju 2x7,5 kg.',metric:[{k:'ohp_kg',l:'DB/tgn (kg)'},{k:'ohp_reps',l:'Rep'}]},
    {n:'7. DB Lateral Raise (#1)',sub:'Bahu Samping / V-Taper',s:3,r:'12-15 (s.d. 20)',u:'Awal: 2 x 2,5 kg',rest:75,targetP10:'2x2,5 kg (3x20) / jembatan 5 kg',plafon:'2 x 5-7,5 kg',info:'Napas: Tarik saat turun, buang saat diangkat ke samping.\nEksekusi: Angkat serong depan 30° setinggi bahu.\nProgresi: Capai 15-20 rep bersih di 2,5 kg sebelum plate pecahan / Set Jembatan ke 5 kg.',metric:[{k:'lat1_kg',l:'DB/tgn (kg)'},{k:'lat1_reps',l:'Rep'}]},
    {n:'8. DB Suitcase Carry',sub:'QL / Anti-Lateral Flexion Core',s:3,r:'25-30 langkah/sisi',u:'Awal: 1 x 10 kg (1 sisi)',rest:60,targetP10:'1 x 12,5-15 kg',plafon:'1 x 17,5-20 kg',info:'Napas: Breathe Behind the Shield (napas dangkal dada atas, perut kunci rapat).\nEksekusi: Jalan tegak 25-30 langkah per sisi tanpa miring.\nProgresi: Tambah ke 40 langkah ATAU +2,5 kg jika stabil penuh.',metric:[{k:'sc_kg',l:'DB (kg)'},{k:'sc_steps',l:'Langkah'}]},
    {n:'9. Treadmill Zona 2',sub:'Kardio Aerobik Basis (138-152 bpm)',s:1,r:'15 Menit',u:'Incline 0%',rest:0,tm:true,timerSec:900,targetP10:'Efisiensi pace di Z2',plafon:'Lolos Talk Test Lancar',info:'Patokan wajib lolos Talk Test (bisa berbicara kalimat utuh). HR: 138-152 bpm.',metric:[{k:'run_tue_min',l:'Durasi (mnt)'},{k:'run_tue_hr',l:'Avg HR'}]}
  ],

function getW(w){
  let k=PFX+'w'+w,d=JSON.parse(localStorage.getItem(k));
  if(!d){
    d={};DAYS.forEach(x=>d[x]={done:false,sets:{},metrics:{},wm:{},cd:{}});
    if(w===1){
      d.tue.metrics={npu_sec:5,lpd_kg:25,mpu_reps:10,idb_kg:5,scr_kg:18,ohp_kg:5,lat1_kg:2.5,sc_kg:10,run_tue_min:15};
      d.sat.metrics={rdl_kg:12.5,rdl_reps:10,gsq_kg:10,gsq_reps:10,lng_kg:2.5,frm_kg:10,cfp_kg:7.5,hmr_h_kg:5,hmr_l_kg:2.5,dwc_kg:2.5,lat2_kg:2.5,npu2_reps:3,dh_sec:25};
      d.wed.metrics={run_wed_min:35};
      d.fri.metrics={swim_fri_m:25,swim_fri_laps:6};
      d.sun.metrics={swim_sun_min:25};
    }
    localStorage.setItem(k,JSON.stringify(d));
  }
  return d;
}
function saveW(w,d){localStorage.setItem(PFX+'w'+w,JSON.stringify(d));}
function initWeeks(){for(let i=1;i<=11;i++)getW(i);}

function findLastMetric(day,key){
  for(let w=ST.phase;w>=1;w--){
    let d=getW(w)[day];
    if(d&&d.metrics&&d.metrics[key]!==undefined&&d.metrics[key]!=='')return{week:w,value:d.metrics[key]};
  }
  return null;
}

// Audio & Timer Engine
window.addEventListener('pointerdown',()=>{
  if(!actCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)actCtx=new A();}
  if(actCtx&&actCtx.state==='suspended')actCtx.resume();
},{passive:true});

function playBeep(){
  if(!actCtx)return;
  [0,0.22,0.44].forEach(off=>{
    const o=actCtx.createOscillator(),g=actCtx.createGain(),t=actCtx.currentTime+off;
    o.type='sine';o.frequency.setValueAtTime(880,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.4,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g);g.connect(actCtx.destination);
    o.start(t);o.stop(t+0.21);
  });
}

function runBanner(mode,col,sec,onEnd){
  clearInterval(cdInt);
  const b=document.getElementById('rest-banner'),m=document.getElementById('rest-mode'),c=document.getElementById('rest-cd'),bar=document.getElementById('rest-bar');
  b.classList.add('show');b.style.borderColor=col;
  m.textContent=mode;m.style.color=col;m.style.background=col==='var(--gold)'?'var(--gold-bg)':col==='var(--green)'?'var(--green-bg)':'rgba(245,158,11,.15)';
  bar.style.background=col;
  let rem=sec;
  const upd=()=>{
    let mn=String(Math.floor(rem/60)).padStart(2,'0'),sc=String(rem%60).padStart(2,'0');
    c.textContent=`${mn}:${sc}`;
    bar.style.width=`${Math.max(0,(rem/sec)*100)}%`;
  };
  upd();
  cdInt=setInterval(()=>{
    rem--;
    if(rem<0){clearInterval(cdInt);if(onEnd)onEnd();else{playBeep();b.classList.remove('show');}}
    else upd();
  },1000);
}
function startRest(sec){if(sec>0)runBanner('Rest','var(--gold)',sec,null);}
function startActive(sec){
  runBanner('Prep','var(--ora)',4,()=>{
    playBeep();
    runBanner('Aktif','var(--green)',sec,()=>{playBeep();document.getElementById('rest-banner').classList.remove('show');toast('⏱ Timer Selesai!');});
  });
}
function skipCD(){clearInterval(cdInt);document.getElementById('rest-banner').classList.remove('show');}

function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.style.display='none',2200);
}
function showModal(title,body,okTxt,cb){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-body').textContent=body;
  const ok=document.getElementById('m-ok');ok.textContent=okTxt||'OK';
  ok.onclick=()=>{closeModal();if(cb)cb();};
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}

function chgWeek(delta){
  let nw=ST.phase+delta;
  if(nw<1||nw>11)return;
  ST.phase=nw;saveST();render();
}
function setTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.id==='tab-'+t));
  render();
}

function getDayExercises(w,day){
  if(w===11&&EX.w11[day])return EX.w11[day];
  if(day==='wed')return(w>=9&&w<=10)?EX.wed_z3:EX.wed_z2;
  return EX[day]||[];
}

function effSets(ex,w){
  let s=ex.s;
  if(w===5&&s===3)s=2;
  if(ST.sleep==='yellow'&&ST.skipSet&&ex.isComp)s=Math.max(1,s-1);
  return s;
}

function toggleSet(day,ei,si,rest){
  let wd=getW(ST.phase),k=`${ei}_${si}`;
  wd[day].sets[k]=!wd[day].sets[k];
  saveW(ST.phase,wd);
  if(wd[day].sets[k]&&rest>0)startRest(rest);
  render();
}
function toggleWC(day,type,idx){
  let wd=getW(ST.phase);
  wd[day][type][idx]=!wd[day][type][idx];
  saveW(ST.phase,wd);render();
}
function saveMetric(day,key,val){
  let wd=getW(ST.phase);
  wd[day].metrics[key]=val===''?'':(isNaN(val)?val:Number(val));
  saveW(ST.phase,wd);
}
function toggleDone(day){
  let wd=getW(ST.phase);
  wd[day].done=!wd[day].done;
  saveW(ST.phase,wd);
  toast(wd[day].done?'✅ Sesi ditandai selesai!':'Sesi dibuka kembali');
  render();
}

function renderHeader(){
  const w=ST.phase;
  document.getElementById('wnum').textContent=`M${w}/11`;
  const pb=document.getElementById('phase-badge');
  if(w<=4)pb.textContent='FASE 1: ADAPTASI';
  else if(w===5)pb.textContent='PEKAN 5: DELOAD';
  else if(w<=10)pb.textContent='FASE 2: AKSELERASI';
  else pb.textContent='M11: KALISTENIK';
}

  const w=ST.phase,wd=getW(w),dObj=wd[activeDay],exs=getDayExercises(w,activeDay);
  let h=`<div class="card" style="padding:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

      <button class="slp-btn ${ST.sleep==='green'?'on-green':''}" onclick="ST.sleep='green';ST.skipSet=false;saveST();render()">🟢 ≥6.5j (Hijau)</button>
      <button class="slp-btn ${ST.sleep==='yellow'?'on-yellow':''}" onclick="ST.sleep='yellow';saveST();render()">🟡 5–6.5j (Kuning)</button>
      <button class="slp-btn ${ST.sleep==='red'?'on-red':''}" onclick="ST.sleep='red';saveST();render()">🔴 &lt;5j (Merah)</button>
    </div>`;
  if(ST.sleep==='yellow'){
    h+=`<button class="act-btn" style="width:100%;border-color:${ST.skipSet?'var(--ora)':'var(--b2)'};color:${ST.skipSet?'var(--ora)':'var(--t2)'}" onclick="ST.skipSet=!ST.skipSet;saveST();render()">⚡ Skip Set Compound (-1 Set): ${ST.skipSet?'AKTIF':'NONAKTIF'}</button>`;
  }
  if(ST.sleep==='red'){
    h+=`<div class="alert red" style="margin:6px 0 0"><strong>STOP:</strong> Batalkan beban/lari berat! Ganti jalan santai/mobility 10m. <strong>DILARANG RENANG!</strong></div>`;

function expJSON(){
  const out={state:ST,weeks:{}};
  for(let i=1;i<=11;i++)out.weeks[i]=getW(i);
  const str=JSON.stringify(out);
  navigator.clipboard?.writeText(str);
  const b=new Blob([str],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`forge_v40_backup_w${ST.phase}.json`;a.click();
  toast('📥 Backup disalin & diunduh!');
}
function impJSON(){
  const raw=document.getElementById('imp-txt').value.trim();
  if(!raw)return toast('Masukkan JSON terlebih dahulu');
  try{
    const d=JSON.parse(raw);
    if(d.state){ST=d.state;saveST();}
    if(d.weeks){Object.keys(d.weeks).forEach(w=>saveW(w,d.weeks[w]));}
    toast('✅ Data berhasil dipulihkan!');render();
  }catch(e){toast('❌ Format JSON tidak valid');}
}

  let h=`<div class="card"><div class="card-title" style="color:var(--gold)">📖 BLUEPRINT FORGE V4.0 REFERENCE</div><div class="sub-tag">Ketuk setiap modul untuk membaca protokol lengkap</div>`;
  secs.forEach((s,i)=>{
    h+=`<button class="acc-btn" style="font-weight:600;color:var(--tx);margin-top:8px" onclick="this.nextElementSibling.classList.toggle('open')"><span>${s.t}</span><span>▾</span></button>
    <div class="acc-body ${i===0?'open':''}">${s.b}</div>`;
  });
  h+=`</div>`;
  document.getElementById('content').innerHTML=h;
}

function render(){
  renderHeader();
  if(curTab==='workout')renderWorkout();
  else if(curTab==='gate')renderGate();
  else if(curTab==='history')renderHistory();
  else renderInsight();
}

initWeeks();
render();
</script>
</body>
